# Deployment configuration for mStocks protocol.
# Read natively by `script/Deploy.s.sol` via Foundry's vm.parseToml* cheatcodes.
#
# Address fields set to the zero address (0x0000...0000) fall back to the
# broadcaster (the EOA signing the transactions).

admin = "0x0000000000000000000000000000000000000000"
proxyAdmin = "0x0000000000000000000000000000000000000000"

# Factory-wide setting baked into the beacon implementation shared by every deployed token.
[factory]
# Minimum lead time (in seconds) for a scheduled UI-multiplier change on every token this
# factory deploys. Immutable per factory; validated on-chain (non-zero, <= 365 days).
# Defaults to 86400 (24 hours) when omitted.
minMultiplierNotice = 86400

# Optional role grants performed after each contract is deployed.
# Each list contains addresses that will be granted the named role.
# Role admin for every role below is DEFAULT_ADMIN_ROLE — grants are only emitted
# when the broadcaster IS the admin; otherwise the script skips them and prints
# a hint so the operator can grant them manually from the admin account.
[compliance]
opsRole = []        # OPS_ROLE on ComplianceRegistry  — manage blocklist + sanctions

[pauseManager]
opsRole = []        # OPS_ROLE on PauseRegistry       — pause/unpause tokens

# TokenIssuer (optional — only used when calling deployTokenIssuer()).
# - opsRole: addresses granted OPS_ROLE on the issuer (mint/burn/transfer through it)
# - approvedRecipients: addresses pre-registered as approved outbound recipients
[tokenIssuer]
opsRole = []
approvedRecipients = []

# Optional initial-token deployment.
# Remove the entire `[token]` block to skip the first token deploy.
[token]
name = "Apple Inc."
symbol = "AAPL"
identifier = "US0378331005"
# Defaults to top-level `admin` if zero.
admin = "0x0000000000000000000000000000000000000000"
# Addresses granted ISSUER_ROLE on the new token (mint / burn). Must be contracts.
issuers = []
# Addresses granted MULTIPLIER_SCHEDULER_ROLE on the new token (UI multiplier scheduling).
multiplierSchedulers = []
