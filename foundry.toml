[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./config.toml" }]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
